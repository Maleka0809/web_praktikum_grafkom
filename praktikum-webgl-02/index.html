<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum WebGL - Interaktif</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../halaman_awal/praktikum.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="app-container">
        <header class="app-header">
            <a href="../halaman_awal/index.html" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Kembali ke Halaman Awal
            </a>
            <h1>WebGL Canvas Interaktif</h1>
            <p>Eksplorasi grafika komputer: Translasi, Rotasi & Skala</p>
        </header>

        <div class="dashboard">
            <div class="controls-panel">
                <div class="button-group">
                    <button id="btnSpeedUp" class="btn primary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 4 15 12 5 20 5 4"></polygon>
                            <line x1="19" y1="5" x2="19" y2="19"></line>
                        </svg>
                        Cepatin Gerakan
                    </button>
                    <button id="btnSlowDown" class="btn secondary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="19 20 9 12 19 4 19 20"></polygon>
                            <line x1="5" y1="19" x2="5" y2="5"></line>
                        </svg>
                        Lambanin Gerakan
                    </button>
                    <button id="btnClearSpawned" class="btn secondary-btn">Clear Spawn</button>
                </div>
                
                <div class="challenge-controls" style="display: flex; gap: 16px; margin-top: 12px; align-items: center;">
                    <select id="primitiveSelector" style="padding: 6px; border-radius: 6px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
                        <option value="TRIANGLES">Triangle</option>
                        <option value="LINE_STRIP">Line Strip</option>
                        <option value="POINTS">Points</option>
                    </select>
                    
                    <div id="colorButtons" style="display: flex; gap: 8px;">
                        <button class="color-btn" style="background: red;" data-color="1,0,0"></button>
                        <button class="color-btn" style="background: green;" data-color="0,1,0"></button>
                        <button class="color-btn" style="background: blue;" data-color="0,0,1"></button>
                        <button class="color-btn" style="background: cyan;" data-color="0,1,1"></button>
                        <button class="color-btn" style="background: linear-gradient(45deg, red, blue);" data-color="random">?</button>
                    </div>

                    <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); cursor: pointer;">
                        <input type="checkbox" id="toggleGrid" checked>
                        Grid Pattern
                    </label>
                </div>
                <div class="instruction" style="margin-top: 12px;">
                    <span class="key">W</span> perbesar &bull; <span class="key">S</span> perkecil &bull; <span class="key">Arah</span> gerakkan &bull; <span class="key">P</span> pause &bull; <span class="key">C</span> warna &bull; <span class="key">R</span> reset &bull; <strong>Klik Canvas</strong> spawn
                </div>
            </div>

            <div class="stats-panel">
                <div class="stat-card">
                    <span class="stat-label">FPS / Mode</span>
                    <span class="stat-value" id="fpsDisplay">0</span>
                    <span id="drawModeDisplay" style="font-size: 12px; color: var(--accent-color); margin-top: 4px;">TRIANGLES</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Speed / Primitive</span>
                    <span class="stat-value" id="speedDisplay">1.00x</span>
                    <span id="primitiveCountDisplay" style="font-size: 12px; color: var(--accent-color); margin-top: 4px;">4 Obj</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Mouse NDC</span>
                    <span class="stat-value text-small" id="mouseNdcDisplay">0.00, 0.00</span>
                </div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="glCanvas" width="800" height="600">
            </canvas>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>

</html>
