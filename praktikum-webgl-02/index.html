<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum WebGL - Interaktif</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../halaman_awal/praktikum.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="app-container">
        <header class="app-header">
            <a href="../halaman_awal/index.html" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Kembali ke Halaman Awal
            </a>
            <h1>WebGL Canvas Interaktif</h1>
            <p>Eksplorasi grafika komputer: Translasi, Rotasi & Skala</p>
        </header>

        <div class="dashboard">
            <div class="controls-panel">
                <div class="button-group">
                    <button id="btnSpeedUp" class="btn primary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 4 15 12 5 20 5 4"></polygon>
                            <line x1="19" y1="5" x2="19" y2="19"></line>
                        </svg>
                        Cepatin Rotasi
                    </button>
                    <button id="btnSlowDown" class="btn secondary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="19 20 9 12 19 4 19 20"></polygon>
                            <line x1="5" y1="19" x2="5" y2="5"></line>
                        </svg>
                        Lambanin Rotasi
                    </button>
                </div>
                <div class="instruction">
                    <span class="key">W</span> perbesar &bull; <span class="key">S</span> perkecil &bull; <span
                        class="key">Arah</span> gerakkan
                </div>
            </div>

            <div class="stats-panel">
                <div class="stat-card">
                    <span class="stat-label">FPS Monitor</span>
                    <span class="stat-value" id="fpsDisplay">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Multiplier Rotasi</span>
                    <span class="stat-value" id="speedDisplay">1.00x</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Ukuran Objek</span>
                    <span class="stat-value text-small" id="scaleDisplay">~ (160x120 px)</span>
                </div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="glCanvas" width="800" height="600">
            </canvas>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>

</html>
